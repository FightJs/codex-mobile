<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>codexapp · Demo</title><style>

x-width:280px;box-shadow:0 5px 30px #0002}.mobile{display:inline-block;border:0;background:none;font-size:20px;margin-right:12px}header{padding:15px}.content{padding:28px 18px}.welcome h1{font-size:30px}}

const pages={home:{title:'New thread',html:`<div class="welcome"><div><h1>Let's build<br><span class="muted">sample-web-app ⌄</span></h1><p class="muted">Explore an example workspace</p></div></div><div class="composer">Type a message... <span class="muted">(demo only)</span><div class="toolbar">＋ &nbsp;&nbsp; Model ▾ &nbsp;&nbsp; Skills ▾ &nbsp;&nbsp; Low ▾</div></div><p class="hint">Messaging is unavailable in this static preview. Choose a sample thread or Skills Hub to explore.</p>`},thread:{title:'Improve the landing page',html:`<p class="muted">sample-web-app / synthetic conversation</p><div class="bubble">Help me make the landing page clearer on mobile.</div><div class="answer"><strong>Example assistant response</strong><p>I would simplify the hero, make the primary action easy to find, and check the layout at narrow widths.</p><div class="card"><strong>Suggested changes</strong><p>Adjust spacing · Review typography · Test responsive layout</p></div><p class="hint">Illustrative response — no AI request was made.</p></div><div class="composer">Messaging is unavailable in this demo.</div>`},review:{title:'Review a component',html:`<p class="muted">sample-web-app / synthetic conversation</p><div class="bubble">Review this component for accessibility.</div><div class="answer"><strong>Example assistant response</strong><p>Check keyboard access, descriptive labels and visible focus states. Test with a screen reader as well.</p><p class="hint">Illustrative response — no code was inspected.</p></div><div class="composer">Messaging is unavailable in this demo.</div>`},skills:{title:'Skills Hub',html:`<h1>Skills Hub</h1><p class="muted">Browse example skills for common workflows.</p><div class="card"><h3>◇ Code review</h3><p>Explore a structured approach to reviewing changes.</p></div><div class="card"><h3>◇ Testing</h3><p>Plan checks for a feature or fix.</p></div><div class="card"><h3>◇ Documentation</h3><p>Organize and explain a project for its users.</p></div><p class="hint">These are illustrative examples. Installing or running skills is unavailable in this preview.</p>`}};function render(){const key=location.hash.slice(1);const page=pages[key]||pages.home;document.getElementById('title').textContent=page.title;document.getElementById('content').innerHTML=page.html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('selected',b.dataset.page===(pages[key]?key:'home')));document.getElementById('sidebar').classList.remove('open')}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.page;render()}));document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));addEventListener('hashchange',render);render();
</script></body></html>
